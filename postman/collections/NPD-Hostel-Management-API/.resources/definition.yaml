$kind: collection
name: NPD Hostel Management API
description: Comprehensive Postman collection for testing the NPD Hostel Management API. Includes environment variables, authentication inheritance, test scripts to auto-save JWT tokens, and detailed body schemas for all endpoints.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
variables:
  - key: base_url
    value: 'http://localhost:3000'
  - key: token
    value: 'PASTE_YOUR_JWT_TOKEN_HERE'
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: ''
  - type: http:afterResponse
    language: text/javascript
    code: ''
