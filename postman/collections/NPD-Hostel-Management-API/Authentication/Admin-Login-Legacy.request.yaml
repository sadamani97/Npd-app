$kind: http-request
name: Admin Login (Legacy)
method: POST
order: 2000
url: '{{base_url}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.success && jsonData.token) {
          pm.collectionVariables.set("token", jsonData.token);
          console.log("Saved Admin JWT Token to collection variables!");
      }
