$kind: http-request
name: Record Reading (Admin)
method: PUT
order: 4000
url: '{{base_url}}/api/electricity-meters/:meterId/reading'
pathVariables:
  - key: meterId
    value: '1'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_reading": 250.00,
      "rate_per_unit": 14.00,
      "reading_date": "2026-06-08"
    }
